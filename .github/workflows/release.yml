name: Build and Release Windows App

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build with PyInstaller
      run: |
        pip install pyinstaller
        pyinstaller --noconfirm --clean --onefile --name logistics_app run_streamlit_bootstrap.py

    - name: Zip the release
      run: |
        mkdir release
        Copy-Item dist\logistics_app.exe release\logistics_app.exe
        Compress-Archive -Path release\* -DestinationPath release.zip

    - name: Compute SHA256 checksum
      run: |
        $hash = Get-FileHash -Path release.zip -Algorithm SHA256
        "SHA256 ($($hash.Path)): $($hash.Hash)" | Out-File checksum.txt

    - name: Create GitHub Release and Upload Assets
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          release.zip
          checksum.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
